<style>
:root{--gold:#c9b26a;--blood:#8f1224;--parch:#c9c4d8;--wood:#241a30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0810;color:var(--parch);font-family:'Press Start 2P','Courier New',monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated;display:block}
#deco{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
#game{border:4px solid var(--wood);box-shadow:0 0 0 4px #000,0 0 0 8px #4a3d6a,0 0 40px #000}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;background:#07050a;z-index:10}
.ov.on{display:flex}
.panel{position:relative;background:linear-gradient(#241c33,#0f0a17);border:4px solid var(--gold);outline:4px solid #000;padding:24px 22px;text-align:center;max-width:94vw;max-height:96vh;overflow:auto;box-shadow:8px 8px 0 #000}
h1{font-size:clamp(18px,4.6vw,34px);line-height:1.5;margin:0 0 20px;color:var(--gold);text-shadow:4px 4px 0 #000}
.btn{font:inherit;font-size:clamp(12px,3vw,18px);color:#fff;background:var(--blood);border:4px solid #000;box-shadow:inset -4px -4px 0 #5e0d19,inset 4px 4px 0 #d8394b;padding:14px 28px;cursor:pointer}
.btn:active{transform:translate(2px,2px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.alt{background:#2a2540;box-shadow:inset -4px -4px 0 #171428,inset 4px 4px 0 #4a4570}
.m{display:block;width:100%;margin:10px 0}
.inp{font:inherit;font-size:18px;background:#000;color:var(--gold);border:4px solid var(--gold);padding:12px;text-align:center;width:min(420px,84vw);outline:none}
.note{font-size:8px;color:#8a85a8;margin-top:12px;line-height:1.6}
#menu{background:radial-gradient(ellipse at 50% 30%,#2a2008 0%,#0a0810 70%);padding:16px}
#menu .panel{width:min(340px,90vw);padding:18px;background:rgba(10,8,14,.85);box-shadow:6px 6px 0 #000}
#menu h1{font-size:clamp(16px,4vw,26px)}
#name label,#hist label{font-size:clamp(14px,3.4vw,22px);margin-bottom:20px;text-align:center;line-height:1.6}
#hint{min-height:20px;margin-top:14px;font-size:10px;color:#9a8f78;text-align:center}
#cont{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom))}
#help .panel{padding:18px 16px;width:min(640px,96vw)}
#help h1{font-size:clamp(16px,4vw,24px);margin-bottom:12px}
#how{font-size:9px;line-height:1.9;margin:0 0 12px;text-align:left}
#hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;text-align:left;margin-bottom:14px}
#hl h2{font-size:11px;color:var(--gold);margin:0 0 6px}
.hi{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:2px solid #2a190e;font-size:8px;line-height:1.7}
.hi canvas{width:40px;height:40px;flex:none;background:#14221a;border:2px solid #000}
#go{display:block;margin-left:auto;font-size:clamp(12px,3vw,16px);padding:12px 26px}
#over{background:rgba(8,4,10,.9)}
#over h1,#pausa h1{color:var(--blood);font-size:clamp(22px,6vw,42px);margin-bottom:10px}
.tb{width:min(520px,92vw);margin:12px 0;font-size:10px;border-collapse:collapse}
.tb td,.tb th{padding:6px;text-align:left;border-bottom:2px solid #3a2a22}
.tb tr.me{color:var(--gold)}
#hr{font-size:10px;line-height:1.8;margin-top:14px;max-height:48vh;overflow:auto;text-align:center}
#pausa{background:rgba(8,4,10,.78)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:20}
#fade.on{opacity:1;pointer-events:all}
#tools{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;z-index:12}
#tools button{font-size:16px;background:#000a;color:#fff;border:2px solid var(--gold);padding:6px 9px;cursor:pointer}
#pause{display:none}
#ctl{display:none}
body.touch #ctl.on{display:block}
#dp{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:150px;height:150px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);z-index:8;touch-action:none;background:rgba(20,16,26,.35);border:3px solid rgba(201,178,106,.6);border-radius:50%}
#dp span{display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;opacity:.8;pointer-events:none}
#atk{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:98px;height:98px;border-radius:50%;font:inherit;font-size:36px;background:rgba(143,18,36,.75);color:#fff;border:4px solid var(--gold);z-index:8;touch-action:none;opacity:.55;filter:grayscale(.7)}
#atk.rdy{opacity:1;filter:none;box-shadow:0 0 18px #ffd54a}
#bmsg{background:rgba(8,4,10,.6);justify-content:flex-end}
#bmsg .panel{width:min(660px,94vw);text-align:left;margin-bottom:3vh}
#bt{white-space:pre-wrap;font-size:clamp(8px,1.5vw,11px);line-height:1.8;min-height:14em}
#rot{display:none;position:fixed;inset:0;z-index:15;background:#07050a;color:var(--gold);align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;line-height:1.8}
@media (orientation:portrait){body.touch #rot{display:flex}}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}
.btn{background:#8a6a14;box-shadow:inset -4px -4px 0 #5a4408,inset 4px 4px 0 #d4a82e;color:#fff6d8}
.btn.alt{background:#1c1a24;box-shadow:inset -4px -4px 0 #0c0a10,inset 4px 4px 0 #3a3648}
#atk{opacity:1;filter:none;background:rgba(138,106,20,.8)}
#blk,#spc{position:fixed;border-radius:50%;font:inherit;font-size:26px;color:#fff;border:4px solid var(--gold);z-index:8;touch-action:none;width:74px;height:74px;background:rgba(28,26,36,.8)}
#blk{right:max(130px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom))}
#spc{right:max(30px,env(safe-area-inset-right));bottom:max(132px,env(safe-area-inset-bottom));opacity:.55;filter:grayscale(.7)}
#spc.rdy{opacity:1;filter:none;box-shadow:0 0 18px #ffd54a}

.ov{background:linear-gradient(rgba(7,5,10,.9),rgba(7,5,10,.95)),var(--cover) center/cover no-repeat}
#over{background:linear-gradient(rgba(7,5,10,.86),rgba(7,5,10,.93)),var(--cover) center/cover no-repeat}
#pausa{background:rgba(8,4,10,.8)}
#brief{background:rgba(7,5,10,.82)}
#menu{background:#07050a;padding:0;overflow:hidden;justify-content:flex-end;align-items:center}
#menu .cover{position:absolute;inset:-3%;background:var(--cover) center/cover no-repeat;animation:zoomc 28s ease-in-out infinite alternate}
@keyframes zoomc{from{transform:scale(1)}to{transform:scale(1.08) translate(-1%,1%)}}
#menu .fire{position:absolute;inset:0;background:radial-gradient(ellipse at 62% 46%,rgba(255,120,30,.3),transparent 55%);mix-blend-mode:screen;animation:flick 2.4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.55}30%{opacity:1}55%{opacity:.7}80%{opacity:.95}}
#menu #embers{position:absolute;inset:0;width:100%;height:100%}
#menu .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%),linear-gradient(transparent 58%,rgba(0,0,0,.88) 100%)}
#menu .frame{position:absolute;inset:10px;border:2px solid rgba(212,168,46,.5);pointer-events:none}
#menu .frame i{position:absolute;width:28px;height:28px;border:4px solid #d4a82e}
#menu .frame i:nth-child(1){left:-4px;top:-4px;border-right:0;border-bottom:0}
#menu .frame i:nth-child(2){right:-4px;top:-4px;border-left:0;border-bottom:0}
#menu .frame i:nth-child(3){left:-4px;bottom:-4px;border-right:0;border-top:0}
#menu .frame i:nth-child(4){right:-4px;bottom:-4px;border-left:0;border-top:0}
#menu .mbar{position:relative;z-index:2;text-align:center;padding:0 16px max(30px,env(safe-area-inset-bottom));width:100%}
#menu .tag{font-size:clamp(8px,1.5vw,12px);color:#e8c870;letter-spacing:2px;text-shadow:3px 3px 0 #000;margin-bottom:14px}
#menu .mbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#menu .mbtns .btn{min-width:200px;font-size:clamp(11px,1.8vw,16px);padding:14px 22px;margin:0}
#menu #play{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset -4px -4px 0 #5a4408,inset 4px 4px 0 #d4a82e,0 0 0 #ffd54a}50%{box-shadow:inset -4px -4px 0 #5a4408,inset 4px 4px 0 #d4a82e,0 0 22px #ffd54a}}
#menu .note{font-size:8px;color:#b8b0cc;margin-top:12px;text-shadow:2px 2px 0 #000}
@media (max-aspect-ratio:1/1){#menu .cover{background-size:100% auto;background-position:center top;background-color:#07050a}}
.wide{width:min(880px,96vw)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.tab{font:inherit;font-size:9px;padding:9px 12px;background:#1c1a24;color:#c9c4d8;border:2px solid #3a3648;cursor:pointer}
.tab.on{background:#8a6a14;color:#fff;border-color:#d4a82e}
.tc{text-align:left;font-size:9px;line-height:1.9;max-height:58vh;overflow:auto;padding-right:4px}
.sub{font-size:9px;line-height:1.8;color:#c9c4d8;margin:0 0 10px;text-align:left}
#bh h1{font-size:clamp(13px,3vw,20px);margin-bottom:10px;text-align:left}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.kc{display:inline-block;border:2px solid #d4a82e;background:#1c1a24;color:#ffe8a0;padding:4px 7px;margin:0 2px;font-size:10px;border-radius:3px;box-shadow:0 3px 0 #000}
.pot{display:inline-block;width:16px;height:20px;border:2px solid #000;box-shadow:0 0 10px currentColor}
.card{display:flex;gap:12px;align-items:flex-start;border:2px solid #3a3648;background:rgba(16,12,22,.85);padding:10px;margin:8px 0}
.card canvas{flex:none;width:64px;height:64px;background:#14101c;border:2px solid #000}
.nm{color:#ffd54a;font-size:11px}
.chip{display:inline-block;padding:3px 6px;margin:3px 5px 3px 0;border:2px solid;font-size:8px}
.chv{border-color:#c8283c;color:#ff8a98}.chd{border-color:#d4a82e;color:#ffd54a}.chs{border-color:#b070ff;color:#d8b8ff}
.tp{color:#9ae0a0}.tips{margin-top:8px;color:#efe0b8;border-top:2px solid #3a3648;padding-top:8px}
#dsh{position:fixed;right:max(130px,env(safe-area-inset-right));bottom:max(104px,env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;font:inherit;font-size:24px;color:#fff;border:4px solid var(--gold);z-index:8;touch-action:none;background:rgba(28,26,36,.8)}
#arc{position:fixed;right:max(214px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:70px;height:70px;border-radius:50%;font:inherit;font-size:24px;color:#fff;border:4px solid var(--gold);z-index:8;touch-action:none;background:rgba(28,26,36,.8);opacity:.55;filter:grayscale(.7)}
#arc.rdy{opacity:1;filter:none;box-shadow:0 0 18px #ffd54a}
#fin{min-width:min(380px,86vw);margin-top:6px}
.srow{display:flex;justify-content:space-between;gap:24px;padding:9px 0;border-bottom:2px solid #3a3648;font-size:11px}
.srow b{color:#ffd54a}
.mbtns2{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}
</style>
</head>
<body>
<canvas id="deco"></canvas>
<div id="stage"><canvas id="game" width="640" height="360"></canvas></div>

<div id="menu" class="ov on">
  <div class="cover"></div><div class="fire"></div><canvas id="embers"></canvas><div class="vig"></div>
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <div class="mbar">
    <div class="tag">⚔ &nbsp;Uma aventura medieval em pixel art&nbsp; ⚔</div>
    <div class="mbtns">
      <button class="btn" id="play">Jogar</button>
      <button class="btn alt" id="bAbout">Sobre o jogo</button>
    </div>
  </div>
</div>

<div id="help" class="ov">
  <div class="panel wide">
    <h1>Sobre o jogo</h1>
    <div id="tabs" class="tabs"></div>
    <div id="tabc" class="tc"></div>
    <button class="btn" id="go" style="margin-top:14px">Voltar</button>
  </div>
</div>

<div id="over" class="ov">
  <h1>Game Over</h1>
  <div id="fin"></div>
  <div class="mbtns2"><button class="btn" id="retry">Tentar de novo</button><button class="btn alt" id="back">Menu</button></div>
</div>

<div id="brief" class="ov">
  <div class="panel wide">

function buildDeco(){
  DW = Math.ceil(innerWidth/S); DH = Math.ceil(innerHeight/S); dc.width = DW; dc.height = DH;
  brick = document.createElement('canvas'); brick.width = DW; brick.height = DH;
  const b = brick.getContext('2d'), cols = ['#1a1426','#1e1830','#171122','#211a34','#191325'];

  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.7)'); b.fillStyle = g; b.fillRect(0,0,DW,DH);

function pillar(x, w){

function deco(t){
  d.drawImage(brick,0,0);
  const r = cv.getBoundingClientRect(), X = r.left/S, Y = r.top/S, Wd = r.width/S;
  if(X > 14){
    [X/2, DW-X/2].forEach(px => {

      banner(px, 10, 60);
      torch(px, DH*.5, t); torch(px, DH*.8, t);

  }
  if(Y > 14){
    if(Y > 50) arch(DW/2, 6, Math.min(34, Y-14), Y-14);

  }
  const g = d.createLinearGradient(0,DH*.8,0,DH); g.addColorStop(0,'rgba(120,100,160,0)'); g.addColorStop(1,'rgba(120,100,160,.18)');
  d.fillStyle = g; d.fillRect(0,DH*.8,DW,DH*.2);

    e.y -= e.s/DH*.016; if(e.y < 0){ e.y = 1; e.x = Math.random() }

    d.fillRect(e.x*DW + Math.sin(t+e.p)*4, e.y*DH, 1, 1);

    b.x += b.v*.016; if(b.x > DW+10) b.x = -10; if(b.x < -10) b.x = DW+10;
    const y = b.y + Math.sin(t*2+b.p)*6, w = Math.sin(t*14+b.p) > 0 ? 1 : -1;

    d.fillStyle = '#e02040'; d.fillRect(b.x-1,y,1,1); d.fillRect(b.x+1,y,1,1);
  });
}

/* ===== 7. LOOP ===== */
function loop(t){
  const dt = Math.min(.05, (t-lastT)/1000 || 0); lastT = t;
  const act = s => s === 'play' || s === 'cut' || s === 'win' || s === 'lose';
  if(act(state)){ update(dt); if(act(state)) draw() }
  if(act(state) || state === 'pause' || state === 'fading' || state === 'brief') deco(t/1000);
  if(P){ $('#spc').classList.toggle('rdy', P.sp <= 0); $('#arc').classList.toggle('rdy', P.arc >= 100 || P.arcT > 0) }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  b.innerHTML = '<b class="nm">'+i.n+'</b><br><span class="chip chv">VIDA '+i.v+'</span><span class="chip chd">DANO COMUM '+i.d+'</span>'+(i.s ? '<span class="chip chs">ESPECIAL '+i.s+'</span>' : '')+'<br>'+i.t+'<br><span class="tp">Dica: '+i.h+'</span>';
  d.append(b); return d;
}
function buildBrief(n){
  const b = BR[n], el = $('#bcards'); $('#bh').innerHTML = '<h1>'+b.title+'</h1><p class="sub">'+b.sub+'</p>'; el.innerHTML = '';
  b.list.forEach(t => el.append(card(t)));
  const tp = document.createElement('div'); tp.className = 'tips'; tp.innerHTML = b.tips.map(t => '<div>• '+t+'</div>').join(''); el.append(tp);
}
function beginPlay(){ if(state !== 'brief') return; keys.clear(); state = 'play'; show(''); lastT = performance.now(); bnr = 2.2; bt = PHS[ph].n; sfx('click') }
$('#bgo').onclick = beginPlay;
const TABS = {
  'Controles': () => '<div class="row"><span class="kc">W</span><span class="kc">A</span><span class="kc">S</span><span class="kc">D</span> Andar</div><div class="row"><span class="kc">K</span> Ataque comum (50 de dano)</div><div class="row"><span class="kc">J</span> Golpe especial (100 de dano em área)</div><div class="row"><span class="kc">E</span> Dash: esquiva rápida e invulnerável</div><div class="row"><span class="kc">SHIFT</span> Segurar para bloquear com o escudo</div><div class="row"><span class="kc">Q</span> Modo Arcanjo (quando a barra estiver cheia)</div><div class="row"><span class="kc">P</span> Pausar o jogo</div><p><b class="nm">No celular</b><br>Vire o aparelho na horizontal. As setas à esquerda movem o herói. À direita: <span class="kc">⚔</span> ataca, <span class="kc">🛡</span> bloqueia (segure), <span class="kc">✦</span> especial, <span class="kc">💨</span> dash e <span class="kc">✨</span> modo Arcanjo. O botão ⛶ liga a tela cheia.</p>',
  'Combate': () => '<p>Você é um cavaleiro de armadura negra com <b class="nm">500 de vida</b>. Se a vida chegar a zero, é Game Over, mas você pode tentar a fase de novo.</p><div class="card"><div><b class="nm">Ataque e crítico</b><br>50 de dano. Há 15% de chance de acerto crítico, que dobra o dano.</div></div><div class="card"><div><b class="nm">Bloqueio e dash</b><br>O escudo anula ataques comuns e reduz especiais à metade. O dash é uma esquiva rápida: você fica invulnerável por um instante.</div></div><div class="card"><div><b class="nm">Especial</b><br>100 de dano em um círculo ao redor. Cada golpe que você acerta recarrega um pouco dele.</div></div><div class="card"><div><b class="nm">Combo</b><br>Acertar golpes em sequência (menos de 2,6 s entre eles) cria um combo. Combos de 10, 25, 50 e 100 curam vida.</div></div><div class="card"><div><b class="nm">Modo Arcanjo</b><br>Seus golpes e combos enchem a barra ARCANJO. Cheia, aperte <span class="kc">Q</span>: por 8 segundos você tem asas de luz, dano dobrado, mais velocidade, ataques rápidos, especial e dash zerados e uma explosão de luz que atinge quem estiver por perto.</div></div><p><b class="nm">Vilões</b> bloqueiam seus golpes (guarda dourada), causam 50 de dano comum e 100 no especial, e entram em <b class="nm">fúria</b> abaixo de 40% de vida. Ao derrotar um vilão você recupera 60 de vida.</p>',
  'Itens': () => '<p><b class="nm">Poções de cura</b> ficam escondidas nas caixas e barris: a cada 5 segundos uma caixa passa a brilhar na cor da poção. Quebre-a com o ataque.</p><div class="row"><span class="pot" style="background:#3c96ff"></span> Azul: +10 de vida</div><div class="row"><span class="pot" style="background:#46e66e"></span> Verde: +50 de vida</div><div class="row"><span class="pot" style="background:#ffd54a"></span> Dourado: +100 de vida (o mais raro)</div><p><b class="nm">Power-ups</b> (esferas com letra) caem de caixas, de monstros fortes e de monstros ELITE:</p><div class="row"><span class="pot" style="background:#ff6e28"></span> F · Fúria: dano dobrado por 10 s</div><div class="row"><span class="pot" style="background:#50dcff"></span> V · Velocidade: +35% de velocidade e dash mais rápido por 10 s</div><div class="row"><span class="pot" style="background:#ffffd2"></span> E · Escudo divino: invulnerável por 6 s</div><div class="row"><span class="pot" style="background:#be6eff"></span> R · Recarga: zera especial e dash e dá 35% de Arcanjo</div><p><b class="nm">Barris vermelhos explodem!</b> Atraia monstros para perto e acerte o barril: a explosão causa 150 de dano em área (e também machuca você). Barris próximos explodem em cadeia.</p>',
  'Fases': () => '<div class="card"><div><b class="nm">Fase 1 · Entrada do reino e cidade</b><br>Mapa vertical e longo, 140 monstros. Há EMBOSCADAS pelo caminho e monstros ELITE (brilho dourado, 3x mais vida, sempre soltam um power-up). Derrote todos para abrir o portão do castelo.</div></div><div class="card"><div><b class="nm">Fases 2 a 8 · Os 7 pecados capitais</b><br>Cada quarto tem um vilão: Preguiça, Luxúria, Gula, Ganância, Ira, Inveja e Orgulho.</div></div><div class="card"><div><b class="nm">Fase final · Dragão das Trevas</b><br>Arena ampla e um chefe com 1000 de vida. Vença para terminar o jogo.</div></div><p>No início de cada fase, uma tela mostra os inimigos, seus atributos e dicas.</p>',
  'Inimigos': () => '',
  'Dicas': () => '<div class="row">• Quebre as caixas que brilham: elas escondem poções.</div><div class="row">• Use os barris vermelhos como bombas contra grupos.</div><div class="row">• Mantenha o combo: ele recarrega o especial e enche o Arcanjo.</div><div class="row">• Guarde o Arcanjo para uma emboscada ou para um vilão em fúria.</div><div class="row">• Contra vilões: espere a guarda dourada baixar, ou use o especial.</div><div class="row">• Os avisos no chão (círculos e linhas) mostram onde o golpe vai cair: saia a tempo.</div>'
};
function buildHelp(){
  const tb = $('#tabs'); if(tb.children.length) return;
  Object.keys(TABS).forEach((k, i) => {
    const b = document.createElement('button'); b.className = 'tab'+(i ? '' : ' on'); b.textContent = k;
    b.onclick = () => { sfx('click'); tb.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b)); const c = $('#tabc'); c.innerHTML = TABS[k](); if(k == 'Inimigos') ['gb','sk','gl','pg','lx','gu','gr','ir','iv','or','dg'].forEach(t => c.append(card(t))) };
    tb.append(b);
  });
  $('#tabc').innerHTML = TABS['Controles']();
}
/* brasas flutuando sobre a capa */
const emb = $('#embers'), ec = emb.getContext('2d'), EM = Array.from({length:70}, () => ({x:Math.random(), y:Math.random(), v:.02+Math.random()*.05, s:Math.random()*6, z:1+rnd(2)}));
function embLoop(){
  if($('#menu').classList.contains('on')){
    const w = emb.width = innerWidth/2|0, h = emb.height = innerHeight/2|0; ec.clearRect(0,0,w,h);
    EM.forEach(p => { p.y -= p.v*.016; p.s += .03; if(p.y < -.02){ p.y = 1.02; p.x = Math.random() } ec.fillStyle = Math.random() < .08 ? '#fff0b0' : p.z > 1 ? '#ff9a2c' : '#ff4a1c'; ec.globalAlpha = .45+.4*Math.sin(p.s*2); ec.fillRect(p.x*w+Math.sin(p.s)*6, p.y*h, p.z, p.z) });
    ec.globalAlpha = 1;
  }
  requestAnimationFrame(embLoop);
}
embLoop();

$('#bAbout').onclick = () => { initAudio(); sfx('click'); state = 'help'; buildHelp(); show('help') };
$('#go').onclick = () => { sfx('click'); toMenu() };

function pause(){
  if(state !== 'play' && state !== 'cut') return;
  pst = state; state = 'pause'; paused = true; keys.clear();
  if(AC) AC.suspend();
  show('pausa');
}
function resume(){
  if(state !== 'pause') return;
  state = pst; paused = false; lastT = performance.now();
  if(AC) AC.resume();
  show('');
}
$('#pause').onclick = () => { sfx('click'); pause() };
$('#resume').onclick = () => { sfx('click'); resume() };
$('#quit').onclick = () => { paused = false; if(AC) AC.resume(); keys.clear(); state = 'fading'; fadeTo(toMenu) };
addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if(document.hidden) pause() });

/* Fim de jogo: resumo da partida (sem ranking) */
let lastWin = false;
function endGame(win){
  if(state === 'over') return;
  state = 'over'; lastWin = win; setTheme(0); sfx(win ? 'level' : 'over'); keys.clear(); show('over');
  $('#over h1').textContent = win ? 'Vitória!' : 'Game Over';
  $('#fin').innerHTML = [['Tempo de jogo', fmt(tm)], ['Monstros derrotados', tk], ['Maior combo', 'x'+mc], [win ? 'Resultado' : 'Você caiu em', win ? 'Castelo conquistado!' : BR[ph].title.replace(/^[^·]*· /, '')]].map(r => '<div class="srow"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
  $('#retry').textContent = win ? 'Jogar de novo' : 'Tentar a fase de novo';
}
function retryPhase(){ P.hp = 500; P.endT = 0; P.arcT = 0; P.arc = 0; P.cmb = 0; P.dash = 0; startPhase(ph) }
$('#retry').onclick = () => { sfx('start'); if(lastWin) newGame(); else retryPhase() };
$('#back').onclick = () => { sfx('click'); state = 'fading'; fadeTo(toMenu) };

/* ===== 9. CONTROLES ===== */
const MAP = {w:'w', arrowup:'w', s:'s', arrowdown:'s', a:'a', arrowleft:'a', d:'d', arrowright:'d'};
/* Escudo: o estado vem sempre de fontes "ao vivo" (Shift do teclado, toques ativos no botão, mouse),
   então nunca fica travado nem deixa de responder. */
let kShield = false, tShield = false, mShield = false;
const shieldHeld = () => kShield || tShield || mShield;
const clearInput = () => { keys.clear(); kShield = tShield = mShield = false };
const isShift = e => e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.key === 'Shift';
addEventListener('keydown', e => {
  kShield = e.shiftKey || isShift(e);
  const k = isShift(e) ? 'shift' : e.key.toLowerCase();
  if(document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
  if((k === 'p' || k === 'escape') && (state === 'play' || state === 'pause')){ state === 'pause' ? resume() : pause(); return }
  if(state === 'brief' && (k === ' ' || k === 'enter')){ e.preventDefault(); beginPlay(); return }
  if(state !== 'play') return;
  if(k === 'k'){ e.preventDefault(); if(!e.repeat) attack() }
  else if(k === 'j'){ e.preventDefault(); if(!e.repeat) special() }
  else if(k === 'e'){ e.preventDefault(); if(!e.repeat) dash() }
  else if(k === 'q'){ e.preventDefault(); if(!e.repeat) arcanjo() }
  else if(k === 'shift'){ e.preventDefault() }
  else if(MAP[k]){ keys.add(MAP[k]); e.preventDefault() }
});
addEventListener('keyup', e => { kShield = e.shiftKey && !(isShift(e) && !e.shiftKey); const k = e.key.toLowerCase(); if(MAP[k]) keys.delete(MAP[k]) });
['mousemove','mousedown','mouseup'].forEach(ev => addEventListener(ev, e => { kShield = e.shiftKey }));
addEventListener('blur', clearInput); document.addEventListener('visibilitychange', clearInput);
$('#spc').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); special() });
$('#dsh').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); dash() });
$('#arc').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); arcanjo() });
const bk = $('#blk');
bk.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); if(e.pointerType === 'mouse') mShield = true });
['pointerup','pointercancel'].forEach(ev => addEventListener(ev, e => { if(e.pointerType === 'mouse') mShield = false }));
['touchstart','touchmove','touchend','touchcancel'].forEach(ev => addEventListener(ev, e => { tShield = Array.from(e.touches || []).some(t => bk.contains(t.target)) }, {passive:true}));
if('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
const dp = $('#dp'), DK = ['a','d','w','s'];
function dpSet(e){
  const r = dp.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
  DK.forEach(k => keys.delete(k)); if(x < -.14) keys.add('a'); if(x > .14) keys.add('d'); if(y < -.14) keys.add('w'); if(y > .14) keys.add('s');
}
dp.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); dp.setPointerCapture(e.pointerId); dpSet(e) });
dp.addEventListener('pointermove', e => { if(dp.hasPointerCapture(e.pointerId)) dpSet(e) });
['pointerup','pointercancel'].forEach(ev => dp.addEventListener(ev, () => DK.forEach(k => keys.delete(k))));
$('#atk').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); attack() });
addEventListener('contextmenu', e => e.preventDefault());
$('#fs').onclick = () => {
  try{
    const el = document.documentElement;
    if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document) }
    else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if(r && r.then) r.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {}) }
  }catch(e){}
};
function fit(){ const w = Math.max(240, Math.min(innerWidth-16, (innerHeight-16)*16/9)); cv.style.width = w+'px'; cv.style.height = (w*9/16)+'px' }
addEventListener('resize', () => { fit(); buildDeco() });
fit(); buildDeco();
</script>
</body>
</html>
